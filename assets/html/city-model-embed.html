<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="description" content="401数据学社交互式城市要素模型：探索建筑、人口、交通、水系、公共服务与绿地生态。" />
    <title>401 数据学社 · 城市要素实验场</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%235d7469'/%3E%3Cpath d='M12 47V29l12-8v26m0 0V15l16-7v39m0 0V25l12 6v16' fill='none' stroke='%23f4f0e8' stroke-width='5' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
    <style>
      :root {
        --ink: #26332f;
        --muted: #6e7974;
        --paper: #f5f2ea;
        --panel: rgba(247, 244, 237, 0.92);
        --line: rgba(47, 62, 56, 0.14);
        --green: #667f72;
        --green2: #89a092;
        --clay: #b67f70;
        --blue: #7897a1;
        --ochre: #b79562;
        --purple: #91859a;
        --shadow: 0 20px 60px rgba(40, 50, 46, 0.18);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #cfd8d1;
        color: var(--ink);
        font-family: Inter, "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
      }
      button,
      input {
        font: inherit;
      }
      button {
        color: inherit;
      }
      #viewport {
        position: fixed;
        inset: 0;
      }
      #viewport canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      .shell {
        position: fixed;
        inset: 0;
        display: grid;
        grid-template-columns: 328px 1fr;
        pointer-events: none;
      }
      .sidebar {
        pointer-events: auto;
        margin: 18px 0 18px 18px;
        height: calc(100vh - 36px);
        padding: 20px;
        border: 1px solid rgba(255, 255, 255, 0.65);
        border-radius: 24px;
        background: var(--panel);
        box-shadow: var(--shadow);
        backdrop-filter: blur(18px);
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      .brand {
        display: flex;
        gap: 12px;
        align-items: center;
        padding-bottom: 16px;
        border-bottom: 1px solid var(--line);
      }
      .brand-mark {
        width: 48px;
        height: 48px;
        border-radius: 14px;
        background: linear-gradient(145deg, #789084, #4f695e);
        color: #fff;
        display: grid;
        place-items: center;
        font-weight: 800;
        letter-spacing: -1px;
        box-shadow: 0 9px 22px rgba(79, 105, 94, 0.3);
      }
      .brand h1 {
        font-size: 18px;
        margin: 0 0 3px;
        letter-spacing: 0.04em;
      }
      .brand p {
        font-size: 12px;
        margin: 0;
        color: var(--muted);
      }
      .intro {
        margin: 16px 2px 10px;
        font-size: 13px;
        line-height: 1.65;
        color: var(--muted);
      }
      .section-label {
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.12em;
        color: #7a837f;
        margin: 10px 2px 8px;
        text-transform: uppercase;
      }
      .layers {
        display: grid;
        gap: 7px;
        overflow: auto;
        padding-right: 3px;
        scrollbar-width: thin;
      }
      .layer {
        border: 1px solid transparent;
        background: rgba(255, 255, 255, 0.55);
        border-radius: 13px;
        min-height: 46px;
        padding: 9px 11px;
        display: grid;
        grid-template-columns: 34px 1fr auto;
        gap: 9px;
        align-items: center;
        text-align: left;
        cursor: pointer;
        transition: 0.22s ease;
      }
      .layer:hover {
        transform: translateX(3px);
        background: #fff;
        border-color: var(--line);
      }
      .layer.active {
        background: #5f786c;
        color: white;
        border-color: #81988d;
        box-shadow: 0 8px 20px rgba(70, 95, 84, 0.2);
      }
      .layer .ico {
        width: 30px;
        height: 30px;
        border-radius: 9px;
        display: grid;
        place-items: center;
        background: rgba(255, 255, 255, 0.67);
        font-size: 16px;
      }
      .layer.active .ico {
        background: rgba(255, 255, 255, 0.18);
      }
      .layer strong {
        display: block;
        font-size: 13px;
      }
      .layer small {
        display: block;
        font-size: 10px;
        opacity: 0.67;
        margin-top: 2px;
      }
      .layer .count {
        font-size: 11px;
        font-variant-numeric: tabular-nums;
        opacity: 0.65;
      }
      .sidebar-foot {
        margin-top: auto;
        padding-top: 13px;
        border-top: 1px solid var(--line);
        display: flex;
        justify-content: space-between;
        align-items: center;
        color: var(--muted);
        font-size: 11px;
      }
      .live {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .live-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #739681;
        box-shadow: 0 0 0 4px rgba(115, 150, 129, 0.15);
      }
      .topbar {
        position: absolute;
        left: 362px;
        right: 18px;
        top: 18px;
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 14px;
        pointer-events: none;
      }
      .city-title,
      .environment,
      .legend,
      .hint {
        pointer-events: auto;
        border: 1px solid rgba(255, 255, 255, 0.6);
        background: rgba(247, 244, 237, 0.87);
        box-shadow: 0 12px 35px rgba(47, 57, 53, 0.14);
        backdrop-filter: blur(16px);
      }
      .city-title {
        padding: 13px 17px;
        border-radius: 17px;
        min-width: 240px;
      }
      .city-title h2 {
        margin: 0;
        font-size: 15px;
      }
      .city-title p {
        margin: 4px 0 0;
        font-size: 11px;
        color: var(--muted);
      }
      .environment {
        border-radius: 18px;
        padding: 8px;
        display: flex;
        align-items: center;
        gap: 7px;
      }
      .weather-btn,
      .view-btn {
        width: 40px;
        height: 40px;
        border: 1px solid transparent;
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.55);
        cursor: pointer;
        font-size: 18px;
        transition: 0.2s;
      }
      .weather-btn:hover,
      .view-btn:hover {
        background: #fff;
      }
      .weather-btn.active,
      .view-btn.active {
        background: #667f72;
        color: #fff;
        border-color: #83998e;
        box-shadow: 0 5px 14px rgba(82, 108, 96, 0.25);
      }
      .divider {
        width: 1px;
        height: 27px;
        background: var(--line);
        margin: 0 2px;
      }
      .clock {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 7px;
      }
      .clock span {
        font-size: 12px;
        color: var(--muted);
      }
      .clock b {
        min-width: 46px;
        font-size: 12px;
        font-variant-numeric: tabular-nums;
      }
      .clock input {
        width: 120px;
        accent-color: #667f72;
        cursor: pointer;
      }
      .right-stack {
        position: absolute;
        right: 18px;
        top: 86px;
        width: 276px;
        display: grid;
        gap: 10px;
        pointer-events: none;
      }
      .legend {
        pointer-events: auto;
        border-radius: 18px;
        padding: 15px;
        transition: 0.25s;
      }
      .legend.hidden {
        opacity: 0;
        transform: translateY(-7px);
        pointer-events: none;
      }
      .legend-head {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        align-items: flex-start;
      }
      .legend h3 {
        font-size: 14px;
        margin: 0;
      }
      .legend p {
        font-size: 11px;
        line-height: 1.55;
        margin: 7px 0 12px;
        color: var(--muted);
      }
      .legend-items {
        display: grid;
        gap: 7px;
      }
      .legend-item {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 11px;
      }
      .swatch {
        width: 20px;
        height: 6px;
        border-radius: 9px;
      }
      .legend-value {
        margin-left: auto;
        font-variant-numeric: tabular-nums;
        color: var(--muted);
      }
      .hint {
        position: absolute;
        left: 50%;
        bottom: 18px;
        transform: translateX(-50%);
        border-radius: 100px;
        padding: 10px 15px;
        font-size: 11px;
        color: var(--muted);
        pointer-events: none;
        white-space: nowrap;
        transition: 0.25s;
      }
      .poi-card {
        position: fixed;
        z-index: 20;
        width: 230px;
        opacity: 0;
        transform: translate(-50%, -115%) scale(0.94);
        pointer-events: none;
        transition:
          opacity 0.18s,
          transform 0.18s;
        background: #fffdf8;
        border: 1px solid rgba(70, 83, 77, 0.17);
        box-shadow: 0 16px 42px rgba(38, 50, 45, 0.23);
        border-radius: 16px;
        padding: 13px;
      }
      .poi-card.show {
        opacity: 1;
        transform: translate(-50%, -115%) scale(1);
        pointer-events: auto;
      }
      .poi-card:after {
        content: "";
        position: absolute;
        left: 50%;
        bottom: -7px;
        width: 13px;
        height: 13px;
        background: #fffdf8;
        border-right: 1px solid rgba(70, 83, 77, 0.17);
        border-bottom: 1px solid rgba(70, 83, 77, 0.17);
        transform: translateX(-50%) rotate(45deg);
      }
      .poi-top {
        display: flex;
        align-items: center;
        gap: 9px;
      }
      .poi-emoji {
        width: 34px;
        height: 34px;
        border-radius: 10px;
        background: #edf1ec;
        display: grid;
        place-items: center;
        font-size: 19px;
      }
      .poi-card h4 {
        font-size: 13px;
        margin: 0;
      }
      .poi-card .type {
        font-size: 10px;
        color: var(--muted);
        margin-top: 2px;
      }
      .poi-card .message {
        margin: 10px 0 0;
        padding: 9px 10px;
        border-radius: 10px;
        background: #f1eee7;
        font-size: 12px;
        line-height: 1.5;
      }
      .poi-card .close {
        position: absolute;
        right: 8px;
        top: 7px;
        border: 0;
        background: transparent;
        color: #89918d;
        cursor: pointer;
        font-size: 16px;
      }
      .loading {
        position: fixed;
        inset: 0;
        z-index: 40;
        background: #d5ddd6;
        display: grid;
        place-items: center;
        transition: opacity 0.5s;
      }
      .loading.done {
        opacity: 0;
        pointer-events: none;
      }
      .loading-inner {
        text-align: center;
      }
      .loading-logo {
        width: 72px;
        height: 72px;
        border-radius: 22px;
        background: #5f786c;
        color: #fff;
        display: grid;
        place-items: center;
        margin: auto;
        font-weight: 800;
        font-size: 23px;
        box-shadow: 0 14px 38px rgba(70, 90, 81, 0.28);
      }
      .loading p {
        font-size: 12px;
        color: #617069;
        letter-spacing: 0.08em;
      }
      .error {
        position: fixed;
        inset: 0;
        z-index: 50;
        background: #e8e4dc;
        display: none;
        place-items: center;
        padding: 24px;
        text-align: center;
      }
      .error.show {
        display: grid;
      }
      .error h2 {
        font-size: 20px;
      }
      .error p {
        max-width: 520px;
        color: #6e7974;
        line-height: 1.7;
      }
      @media (max-width: 900px) {
        .shell {
          grid-template-columns: 1fr;
        }
        .sidebar {
          width: 290px;
          transform: translateX(-268px);
          transition: 0.25s;
        }
        .sidebar:hover,
        .sidebar:focus-within {
          transform: translateX(0);
        }
        .topbar {
          left: 66px;
        }
        .city-title {
          display: none;
        }
        .right-stack {
          top: 80px;
          width: 235px;
        }
        .clock input {
          width: 72px;
        }
        .environment {
          flex-wrap: wrap;
          justify-content: flex-end;
          max-width: 280px;
        }
        .hint {
          bottom: 12px;
        }
      }
      @media (max-width: 600px) {
        .topbar {
          right: 10px;
          top: 10px;
        }
        .environment {
          padding: 6px;
        }
        .weather-btn,
        .view-btn {
          width: 35px;
          height: 35px;
        }
        .clock {
          width: 100%;
          justify-content: flex-end;
        }
        .right-stack {
          right: 10px;
          top: 126px;
        }
        .hint {
          font-size: 10px;
        }
        .sidebar {
          margin: 10px 0 10px 10px;
          height: calc(100vh - 20px);
        }
      }
      /* Embedded mode: the parent page owns navigation and layer selection. */
      .shell {
        display: none;
      }
      .topbar {
        left: 12px;
        right: 12px;
        top: 12px;
        justify-content: flex-end;
      }
      .city-title {
        display: none;
      }
      .environment {
        padding: 6px;
        transform: scale(0.9);
        transform-origin: top right;
      }
      .right-stack {
        right: 12px;
        top: 74px;
        width: 250px;
      }
      .hint {
        bottom: 10px;
        font-size: 10px;
      }
      @media (max-width: 700px) {
        .topbar {
          left: 8px;
          right: 8px;
        }
        .clock input {
          width: 72px;
        }
        .right-stack {
          display: none;
        }
        .hint {
          display: none;
        }
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <div id="viewport" aria-label="可旋转缩放的三维城市模型"></div>
    <div class="shell">
      <aside class="sidebar" aria-label="城市数据分类">
        <div class="brand">
          <div class="brand-mark">401</div>
          <div>
            <h1>数据学社</h1>
            <p>Urban Data Commons</p>
          </div>
        </div>
        <p class="intro">从城市要素出发，观察空间结构与公共服务。选择数据图层，城市会用对应的方式回应。</p>
        <div class="section-label">城市数据图层</div>
        <nav class="layers">
          <button class="layer active" data-layer="all">
            <span class="ico">◎</span><span><strong>城市全景</strong><small>综合城市运行状态</small></span
            ><span class="count">LIVE</span>
          </button>
          <button class="layer" data-layer="population">
            <span class="ico">人</span><span><strong>人口分布</strong><small>居住密度与服务需求</small></span
            ><span class="count" id="populationCount">—</span>
          </button>
          <button class="layer" data-layer="traffic">
            <span class="ico">↗</span><span><strong>交通网络</strong><small>道路、车辆与信号控制</small></span
            ><span class="count">6×6</span>
          </button>
          <button class="layer" data-layer="water">
            <span class="ico">≈</span><span><strong>河流水系</strong><small>滨水空间与生态缓冲</small></span
            ><span class="count">1.8 km</span>
          </button>
          <button class="layer" data-layer="buildings">
            <span class="ico">▥</span><span><strong>建筑形态</strong><small>高度、功能与开发强度</small></span
            ><span class="count" id="buildingCount">—</span>
          </button>
          <button class="layer" data-layer="facilities">
            <span class="ico">＋</span><span><strong>公共设施</strong><small>全域教育、医疗与应急服务</small></span
            ><span class="count" id="facilityCount">—</span>
          </button>
          <button class="layer" data-layer="green">
            <span class="ico">♧</span><span><strong>绿地生态</strong><small>3座综合公园＋5座口袋公园</small></span
            ><span class="count">8</span>
          </button>
        </nav>
        <div class="sidebar-foot">
          <span class="live"><i class="live-dot"></i>城市模型运行中</span><span>拖拽 · 缩放 · 点击</span>
        </div>
      </aside>
    </div>
    <div class="topbar">
      <div class="city-title">
        <h2>401 城市 · 城市要素实验场</h2>
        <p id="statusLine">晴 · 12:00 · 日间可视模式</p>
      </div>
      <div class="environment" aria-label="天气与时间控制">
        <button class="weather-btn active" data-weather="sun" title="晴天" aria-label="晴天">☀</button>
        <button class="weather-btn" data-weather="cloud" title="多云" aria-label="多云">☁</button>
        <button class="weather-btn" data-weather="rain" title="雷暴雨" aria-label="雷暴雨">⚡</button>
        <button class="weather-btn" data-weather="snow" title="降雪" aria-label="降雪">❄</button>
        <div class="divider"></div>
        <div class="clock">
          <span>时间</span><input id="time" type="range" min="0" max="24" step="0.1" value="12" aria-label="城市时间" /><b id="timeLabel">12:00</b>
        </div>
        <div class="divider"></div>
        <button id="resetView" class="view-btn" title="回到全景" aria-label="回到全景">⌂</button>
      </div>
    </div>
    <div class="right-stack">
      <section id="legend" class="legend hidden">
        <div class="legend-head">
          <h3 id="legendTitle"></h3>
          <span id="legendBadge"></span>
        </div>
        <p id="legendText"></p>
        <div id="legendItems" class="legend-items"></div>
      </section>
    </div>
    <div id="hint" class="hint">选择数据图层；点击屋顶设施图标，或观察街头随机刷新的市民对话</div>
    <article id="poiCard" class="poi-card" aria-live="polite">
      <button class="close" aria-label="关闭">×</button>
      <div class="poi-top">
        <div id="poiEmoji" class="poi-emoji"></div>
        <div>
          <h4 id="poiName"></h4>
          <div id="poiType" class="type"></div>
        </div>
      </div>
      <p id="poiMessage" class="message"></p>
    </article>
    <div id="loading" class="loading">
      <div class="loading-inner">
        <div class="loading-logo">401</div>
        <p>正在唤醒城市…</p>
      </div>
    </div>
    <div id="error" class="error">
      <div>
        <h2>城市模型暂时没有加载成功</h2>
        <p>请检查网络后刷新页面。模型需要加载三维引擎，其他页面内容仍然安全。</p>
      </div>
    </div>

    <script type="module">
      import * as THREE from "three";
      import { OrbitControls } from "three/addons/controls/OrbitControls.js";

      try {
        const C = {
          skyDay: 0xd9e0da,
          skyDusk: 0xb6aaa5,
          skyNight: 0x17242b,
          ground: 0xd8d3c7,
          groundNight: 0x28332f,
          road: 0x777c7a,
          roadNight: 0x3f4746,
          water: 0x789da7,
          green: 0x789172,
          tree: 0x55705d,
          wood: 0x796958,
          window: 0xffd996,
          outline: 0xfff2c9,
          traffic: 0xb58a62,
          popLow: 0xd9c9b9,
          popMid: 0xc98f7d,
          popHigh: 0xa95855,
        };
        const now = new Date();
        const state = {
          time: now.getHours() + now.getMinutes() / 60,
          weather: "sun",
          layer: "all",
          selected: null,
          night: 0,
          lightning: 0,
          nextLightning: 4,
        };
        const registry = {
          buildings: [],
          roads: [],
          cars: [],
          water: [],
          parks: [],
          trees: [],
          pois: [],
          signals: [],
          lamps: [],
          weather: [],
          population: [],
          people: [],
          dogs: [],
          cyclists: [],
          conversations: [],
          crosswalks: [],
        };
        const container = document.getElementById("viewport");
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(C.skyDay);
        scene.fog = new THREE.FogExp2(C.skyDay, 0.00024);
        const camera = new THREE.PerspectiveCamera(39, innerWidth / innerHeight, 1, 3400);
        camera.position.set(790, 650, 790);
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(innerWidth, innerHeight);
        renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.1;
        container.appendChild(renderer.domElement);
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.target.set(0, 25, 0);
        controls.enableDamping = true;
        controls.dampingFactor = 0.055;
        controls.minDistance = 320;
        controls.maxDistance = 1750;
        controls.maxPolarAngle = Math.PI * 0.47;
        controls.minPolarAngle = Math.PI * 0.12;
        const hemi = new THREE.HemisphereLight(0xf7faf6, 0x6c746c, 1.25);
        scene.add(hemi);
        const sun = new THREE.DirectionalLight(0xfff4df, 2.4);

        };
        addEventListener("message", (event) => {
          if (event.data?.type !== "set-city-layer") return;
          applyLayer(externalLayerMap[event.data.category] || "all");
        });
        const raycaster = new THREE.Raycaster(),
          mouse = new THREE.Vector2();
        function pick(e) {
          mouse.x = (e.clientX / innerWidth) * 2 - 1;
          mouse.y = -(e.clientY / innerHeight) * 2 + 1;
          raycaster.setFromCamera(mouse, camera);
          const hits = raycaster.intersectObjects([...registry.pois, ...registry.buildings], false);
          if (!hits.length) return closeCard();
          let o = hits[0].object;
          if (o.userData.kind === "building" && o.userData.poi) o = o.userData.poi;
          if (o.userData.kind === "poi") openPOI(o);
        }
        function openPOI(sprite) {
          if (state.selected?.outline) city.remove(state.selected.outline);
          const b = sprite.userData.building;
          const edges = new THREE.EdgesGeometry(b.geometry);
          const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: C.outline, transparent: true, opacity: 0.95 }));
          line.position.copy(b.position);
          line.scale.set(1.05, 1.03, 1.05);
          city.add(line);
          state.selected = { sprite, building: b, outline: line };
          const f = sprite.userData.facility;
          document.getElementById("poiEmoji").textContent = f[2];
          document.getElementById("poiName").textContent = f[1];
          document.getElementById("poiType").textContent = f[3] + " · 点击建筑高亮";
          document.getElementById("poiMessage").textContent = f[4];
          document.getElementById("poiCard").classList.add("show");
          applyLayer("facilities");
          positionCard();
        }
        function closeCard() {
          document.getElementById("poiCard").classList.remove("show");
          if (state.selected?.outline) city.remove(state.selected.outline);
          state.selected = null;
        }
        document.getElementById("poiCard").querySelector(".close").addEventListener("click", closeCard);
        renderer.domElement.addEventListener("click", pick);
        renderer.domElement.addEventListener("pointermove", (e) => {
          mouse.x = (e.clientX / innerWidth) * 2 - 1;
          mouse.y = -(e.clientY / innerHeight) * 2 + 1;
          raycaster.setFromCamera(mouse, camera);
          renderer.domElement.style.cursor = raycaster.intersectObjects(
            [...registry.pois, ...registry.buildings.filter((b) => b.userData.poi)],
            false
          ).length
            ? "pointer"
            : "grab";
        });
        function positionCard() {
          if (!state.selected) return;
          const p = state.selected.sprite.getWorldPosition(new THREE.Vector3()).project(camera);
          const card = document.getElementById("poiCard");
          card.style.left = (p.x * 0.5 + 0.5) * innerWidth + "px";
          card.style.top = (-p.y * 0.5 + 0.5) * innerHeight + "px";
        }

        function setWeather(w) {
          state.weather = w;
          document.querySelectorAll(".weather-btn").forEach((b) => b.classList.toggle("active", b.dataset.weather === w));
          cloudMaterial.color.set(w === "rain" ? 0x59646b : 0xf5f5f0);
          const names = { sun: "晴", cloud: "多云", rain: "雷暴雨", snow: "降雪" };
          updateStatus(names[w]);
        }
        document.querySelectorAll(".weather-btn").forEach((b) => b.addEventListener("click", () => setWeather(b.dataset.weather)));
        function updateStatus(weatherName) {
          const t = formatTime(state.time),
            mode = state.time >= 20 || state.time < 6 ? "夜间灯光模式" : "日间可视模式";
          document.getElementById("statusLine").textContent =
            `${weatherName || { sun: "晴", cloud: "多云", rain: "雷暴雨", snow: "降雪" }[state.weather]} · ${t} · ${mode}`;
        }
        function formatTime(t) {
          let h = Math.floor(t) % 24,
            m = Math.round((t - h) * 60);
          if (m === 60) {
            h = (h + 1) % 24;
            m = 0;
          }
          return String(h).padStart(2, "0") + ":" + String(m).padStart(2, "0");
        }
        function updateTime() {
          const t = state.time;
          const daylight = Math.max(0, Math.sin(((t - 6) / 12) * Math.PI));
          const twilight = t >= 18 && t < 20 ? (t - 18) / 2 : t >= 5 && t < 7 ? 1 - (t - 5) / 2 : t >= 20 || t < 5 ? 1 : 0;
          state.night = THREE.MathUtils.clamp(twilight, 0, 1);
          const sky = new THREE.Color();
          if (state.night < 0.55) sky.lerpColors(new THREE.Color(C.skyDay), new THREE.Color(C.skyDusk), state.night * 1.8);
          else sky.lerpColors(new THREE.Color(C.skyDusk), new THREE.Color(C.skyNight), (state.night - 0.55) / 0.45);
          scene.background.copy(sky);
          scene.fog.color.copy(sky);
          sun.position.set(Math.cos(((t - 6) / 12) * Math.PI) * 430, 60 + daylight * 460, Math.sin(((t - 6) / 12) * Math.PI) * 260);
          sun.userData.baseIntensity = 0.18 + daylight * 2.45;
          sun.intensity = sun.userData.baseIntensity;
          moon.intensity = state.night * 0.62;
          hemi.intensity = 0.38 + (1 - state.night) * 0.9;
          renderer.toneMappingExposure = 0.7 + (1 - state.night) * 0.38;
          const lightsOn = t >= 20 || t < 6;
          registry.buildings.forEach((b) => (b.userData.baseMat.emissiveIntensity = lightsOn ? 0.85 : 0));
          registry.lamps.forEach((l) => (l.bulb.material.emissiveIntensity = lightsOn ? 3.2 : 0));
          if (state.layer === "all") groundMat.color.set(state.night > 0.58 ? C.groundNight : C.ground);
          document.getElementById("timeLabel").textContent = formatTime(t);
          updateStatus();
        }
        document.getElementById("time").addEventListener("input", (e) => {
          state.time = parseFloat(e.target.value);
          updateTime();
        });
        document.getElementById("resetView").addEventListener("click", () => {
          camera.position.set(790, 650, 790);
          controls.target.set(0, 25, 0);
          controls.update();
          closeCard();
          applyLayer("all");
        });

        const clock = new THREE.Clock();
        let signalClock = 0,
          conversationClock = 0;
        function animate() {
          requestAnimationFrame(animate);
          const dt = Math.min(clock.getDelta(), 0.05),
            elapsed = clock.elapsedTime;
          controls.update();
          signalClock = (signalClock + dt) % 12;
          conversationClock += dt;
          if (conversationClock > 9) {
            conversationClock = 0;
            refreshConversations();
          }
          registry.signals.forEach((s) => {
            const phase = (signalClock + (s.userData.phase ? 6 : 0)) % 12,
              green = phase < 5,
              yellow = phase >= 5 && phase < 6;
            s.userData.lamps[0].material.emissiveIntensity = !green && !yellow ? 2.6 : 0.04;
            s.userData.lamps[1].material.emissiveIntensity = yellow ? 2.6 : 0.04;
            s.userData.lamps[2].material.emissiveIntensity = green ? 2.6 : 0.04;
          });
          registry.cars.forEach((c, i) => {
            const u = c.userData,
              limit = u.axis === "x" ? 525 : 425,
              pos = u.axis === "x" ? c.position.x : c.position.z;
            const nearSignal = (u.axis === "x" ? roadX : roadZ).some((v) => Math.abs(pos - v) < 19),
              stopPhase = (signalClock + (i % 2 ? 0 : 6)) % 12 > 5.1;
            const following = registry.cars.some((o) => {
              if (o === c || o.userData.axis !== u.axis || o.userData.lane !== u.lane || o.userData.direction !== u.direction) return false;
              const other = u.axis === "x" ? o.position.x : o.position.z,
                gap = (other - pos) * u.direction;
              return gap > 0 && gap < 14;
            });
            const speed = (nearSignal && stopPhase) || following ? 0 : u.speed;
            if (u.axis === "x") c.position.x += speed * dt * u.direction;
            else c.position.z += speed * dt * u.direction;
            if ((u.axis === "x" ? c.position.x : c.position.z) > limit) u.axis === "x" ? (c.position.x -= limit * 2) : (c.position.z -= limit * 2);
            if ((u.axis === "x" ? c.position.x : c.position.z) < -limit) u.axis === "x" ? (c.position.x += limit * 2) : (c.position.z += limit * 2);
          });
          registry.people.forEach((p, i) => {
            const u = p.userData,
              a = elapsed * u.speed + u.phase;
            p.position.x = u.center.x + Math.cos(a) * u.radius;
            p.position.z = u.center.y + Math.sin(a) * u.radius;
            p.position.y = 0.13 + Math.abs(Math.sin(elapsed * 4 + i)) * 0.12;
            p.rotation.y = -a + Math.PI / 2;
          });
          registry.dogs.forEach((d, i) => {
            const o = d.userData.owner;
            d.position.x += (o.position.x + d.userData.offset - d.position.x) * 0.08;
            d.position.z += (o.position.z + Math.sin(elapsed + i) * 2 - d.position.z) * 0.08;
            d.position.y = 0.13;
            d.rotation.y = Math.atan2(o.position.x - d.position.x, o.position.z - d.position.z);
          });
          registry.cyclists.forEach((c) => {
            const u = c.userData,
              limit = u.axis === "x" ? 520 : 420;
            if (u.axis === "x") {
              c.position.x += u.speed * dt * u.direction;
              c.position.z = u.lane;
              c.rotation.y = u.direction > 0 ? 0 : Math.PI;
              if (c.position.x > limit) c.position.x = -limit;
              if (c.position.x < -limit) c.position.x = limit;
            } else {
              c.position.z += u.speed * dt * u.direction;
              c.position.x = u.lane;
              c.rotation.y = u.direction > 0 ? -Math.PI / 2 : Math.PI / 2;
              if (c.position.z > limit) c.position.z = -limit;
              if (c.position.z < -limit) c.position.z = limit;
            }
            c.position.y = 0.14;
            u.wheels.forEach((w) => (w.rotation.z -= (u.speed * dt * u.direction) / 1.55));
          });
          registry.conversations.forEach((c) => {
            c.bubble.position.x = (c.a.position.x + c.b.position.x) / 2;
            c.bubble.position.z = (c.a.position.z + c.b.position.z) / 2;
            c.bubble.position.y = 18 + Math.sin(elapsed * 1.5) * 0.5;
          });
          registry.pois.forEach((s, i) => (s.position.y = s.userData.baseY + Math.sin(elapsed * 1.8 + i) * 1.25));
          const cloudy = state.weather !== "sun",
            raining = state.weather === "rain",
            snowing = state.weather === "snow";
          cloudMaterial.opacity += ((raining ? 0.96 : cloudy ? 0.84 : 0) - cloudMaterial.opacity) * 0.035;
          cloudGroup.children.forEach((g, i) => {
            g.position.x += dt * (5 + i * 0.18);
            if (g.position.x > 820) g.position.x = -820;
          });
          rain.mat.opacity += ((raining ? 0.9 : 0) - rain.mat.opacity) * 0.1;
          snow.mat.opacity += ((snowing ? 0.88 : 0) - snow.mat.opacity) * 0.08;
          [
            [rain, raining ? 235 : 0],
            [snow, snowing ? 34 : 0],
          ].forEach(([sys, vel]) => {
            if (!vel) return;
            const a = sys.geo.attributes.position.array;
            for (let i = 0; i < sys.count; i++) {
              a[i * 3 + 1] -= vel * dt;
              if (sys === rain) a[i * 3] += 65 * dt;
              else a[i * 3] += Math.sin(elapsed + i) * dt * 4;
              if (a[i * 3 + 1] < 0) {
                a[i * 3 + 1] = 480;
                a[i * 3] = (Math.random() - 0.5) * 1600;
              }
              if (a[i * 3] > 800) a[i * 3] = -800;
            }
            sys.geo.attributes.position.needsUpdate = true;
          });
          if (raining) {
            state.nextLightning -= dt;
            if (state.nextLightning <= 0) {
              state.lightning = 0.22;
              state.nextLightning = 2.2 + Math.random() * 4.8;
              const x = (Math.random() - 0.5) * 950,
                z = (Math.random() - 0.5) * 720;
              lightningBolt.position.set(x - 180, 0, z - 40);
              lightningLight.position.set(x, 260, z);
            }
            state.lightning = Math.max(0, state.lightning - dt);
            const flash = state.lightning / 0.22;
            lightningLight.intensity = flash * 11;
            lightningBolt.material.opacity = flash;
          } else {
            state.lightning = 0;
            lightningLight.intensity = 0;
            lightningBolt.material.opacity = 0;
          }
          sun.intensity =
            (sun.userData.baseIntensity || 1) *
            (state.weather === "sun" ? 1 : state.weather === "cloud" ? 0.72 : state.weather === "rain" ? 0.34 : 0.55);
          positionCard();
          renderer.render(scene, camera);
        }
        document.getElementById("time").value = state.time;
        updateTime();
        applyLayer("all");
        animate();
        addEventListener("resize", () => {
          camera.aspect = innerWidth / innerHeight;
          camera.updateProjectionMatrix();
          renderer.setSize(innerWidth, innerHeight);
          positionCard();
        });
        setTimeout(() => document.getElementById("loading").classList.add("done"), 500);
      } catch (err) {
        console.error(err);
        document.getElementById("loading").classList.add("done");
        document.getElementById("error").classList.add("show");
      }
    </script>
  </body>
</html>
